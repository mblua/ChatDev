graph:
  id: MB_mule_app
  description: Genera aplicaciones MuleSoft con ciclo de especificacion, desarrollo y verificacion
  log_level: DEBUG
  is_majority_voting: false
  start:
    - SpecArchitect
  end:
    - FINAL
  nodes:
    # Nodo 1: Arquitecto de Especificaciones
    - id: SpecArchitect
      type: agent
      description: Genera la especificacion RAML/OAS y diseño de la aplicacion Mule
      context_window: 2
      config:
        provider: openai
        name: gpt-4o
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        role: |
          MuleSoft Solutions Architect. Create technical spec for Mule app:
          - RAML 1.0 or OAS 3.0 specification (in code block)
          - Data types/schemas
          - API-led layer (Experience/Process/System)
          - Required connectors
          - Error handling strategy

          DOCS: mule-docs/templates/mulesoft-api-led-app-template.md, mule-docs/conventions/naming-conventions.md
          Use read_file_segment to consult docs when needed.
        params:
          temperature: 0.2
          max_tokens: 2000
        tooling:
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: search_in_files

    # Nodo 2: Desarrollador Mule
    - id: MuleDeveloper
      type: agent
      description: Implementa la aplicacion Mule basada en la especificacion
      context_window: 2
      config:
        provider: openai
        name: gpt-4o
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        role: |
          Senior MuleSoft Developer (Mule 4). Create complete application:
          - Mule XML configs (global.xml, interface.xml, implementation.xml)
          - DataWeave transformations
          - Error handlers
          - config.yaml properties
          - pom.xml dependencies

          Each file in separate code block with filename. Fix any feedback issues.
          DOCS: mule-docs/templates/mulesoft-api-led-app-template.md (structure), mule-docs/conventions/naming-conventions.md
        params:
          temperature: 0.1
          max_tokens: 3000
        tooling:
          - type: function
            config:
              tools:
                - name: list_directory
                - name: read_file_segment
                - name: save_file

    # Nodo 3: QA/Verificador
    - id: QAVerifier
      type: agent
      description: Verifica la implementacion y reporta errores
      context_window: 2
      config:
        provider: openai
        name: gpt-4o
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        role: |
          MuleSoft QA Engineer. Verify: XML syntax, DataWeave validity, error handling, security, spec alignment.

          Response format:
          - If OK: Start with "APPROVED" + brief summary
          - If issues: Start with "NEEDS_REVISION" + list issues with file, problem, fix

          Only reject for real issues, not style preferences.
        params:
          temperature: 0.1
          max_tokens: 1500
        tooling:
          - type: function
            config:
              tools:
                - name: read_file_segment

    # Nodo 4: Loop Counter para limitar iteraciones
    - id: RevisionLoopCounter
      type: loop_counter
      description: Limita las iteraciones de revision a 2
      context_window: 0
      config:
        max_iterations: 2
        reset_on_emit: false
        message: 'Max revisions reached. Proceeding with current implementation.'

    # Nodo 5: Final
    - id: FINAL
      type: passthrough
      description: Nodo final del workflow
      context_window: 0
      config: {}

  edges:
    - from: SpecArchitect
      to: MuleDeveloper

    - from: MuleDeveloper
      to: QAVerifier

    - from: QAVerifier
      to: FINAL
      condition:
        type: keyword
        config:
          any:
            - APPROVED
          case_sensitive: false

    - from: QAVerifier
      to: RevisionLoopCounter
      condition:
        type: keyword
        config:
          any:
            - NEEDS_REVISION
          case_sensitive: false

    - from: RevisionLoopCounter
      to: MuleDeveloper

  memory: []
  initial_instruction: ''
