version: 0.0.0
vars: {}
graph:
  id: code_run
  description: Human provides code, then a Python node executes it.
  is_majority_voting: false
  start:
    - A
  nodes:
    - id: B
      type: python
      config:
        timeout_seconds: 60
    - id: A
      type: human
      config:
        description: 'Please, write a piece of code. '
      description: ''
      context_window: 0
  edges:
    - from: A
      to: B
